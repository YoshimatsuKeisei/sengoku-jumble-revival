name: Validate raw normal contact attack edge cases

on:
  push:
    branches:
      - debug/current-20260907-normal-contact-attack-validation
    paths:
      - ".github/workflows/normal-contact-attack-validation.yml"
      - "tests/swf-spec/normalContactSequentialAttackConformance.test.ts"
      - "src/game/systems/normalContactAttackSystem.ts"
      - "src/game/systems/swfSoldierContactSystem.ts"
      - "src/game/systems/normalCombatSystem.ts"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vite production bundle
        run: npx vite build
      - name: Expanded normal-contact conformance
        run: >-
          npx vitest run
          tests/swf-spec/normalContactSequentialAttackConformance.test.ts
          tests/swf-spec/soldierContactSequentialRuntime.test.ts
          tests/swf-spec/soldierContactFrameIntegration.test.ts
          tests/swf-spec/soldierContactCrowdRegression.test.ts
          tests/swf-spec/soldierContactGridSpecConformance.test.ts
          --reporter=verbose
      - name: Full SWF conformance suite
        run: npx vitest run tests/swf-spec --reporter=verbose
      - name: Stable movement/base regressions
        run: >-
          npx vitest run
          src/game/systems/baseContactSystem.test.ts
          src/game/systems/swfIntegrationPreservation.test.ts
          src/game/systems/phase3eBattlefield.test.ts
          src/game/systems/phase3fFidelity.test.ts
          src/game/systems/phase3gFixes.test.ts
          src/game/systems/phase3hIntegration.test.ts
          src/game/systems/phase3jPlayerControl.test.ts
          --reporter=verbose
      - name: Strategy regression
        run: npx vitest run src/game/systems/strategyEngagement.test.ts src/game/systems/phase4c1TargetStrategy.test.ts --reporter=verbose
