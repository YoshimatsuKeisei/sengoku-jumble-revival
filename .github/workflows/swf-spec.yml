name: Ranged activation focused CI

on:
  push:
    branches:
      - debug/current-20260907-ranged-activation-ci
    paths:
      - "src/**"
      - "tests/swf-spec/**"
      - "swf-spec/**"
      - ".github/workflows/swf-spec.yml"

concurrency:
  group: ranged-activation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vite production bundle
        run: npx vite build
      - name: Ranged activation conformance
        run: >-
          npx vitest run
          tests/swf-spec/rangedTargetAcquisitionDirectConformance.test.ts
          tests/swf-spec/rangedCommandDirectConformance.test.ts
          tests/swf-spec/rangedGaugeDirectConformance.test.ts
          tests/swf-spec/forcedRangedNoTarget.test.ts
          tests/swf-spec/rangedTargetImpulseConformance.test.ts
          --reporter=verbose
      - name: Strategy target regression
        run: >-
          npx vitest run
          src/game/systems/strategyEngagement.test.ts
          src/game/systems/phase4c1TargetStrategy.test.ts
          --reporter=verbose
