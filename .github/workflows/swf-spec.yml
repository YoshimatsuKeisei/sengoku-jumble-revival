name: Ranged command batch CI

on:
  workflow_dispatch:
  push:
    branches:
      - debug/current-20260907-ranged-batch-ci

concurrency:
  group: ranged-command-batch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vite production bundle
        run: npx vite build
      - name: General command, ranged, trap, and runtime conformance
        run: >-
          npx vitest run
          tests/swf-spec/rangedCommandDirectConformance.test.ts
          tests/swf-spec/rangedGaugeDirectConformance.test.ts
          tests/swf-spec/rangedTargetAcquisitionDirectConformance.test.ts
          tests/swf-spec/rangedTargetImpulseConformance.test.ts
          tests/swf-spec/forcedRangedNoTarget.test.ts
          tests/swf-spec/runtimeCharacterization.test.ts
          tests/swf-spec/swfConformance.test.ts
          --reporter=verbose
      - name: Strategy regression
        run: >-
          npx vitest run
          src/game/systems/strategyEngagement.test.ts
          src/game/systems/phase4c1TargetStrategy.test.ts
          --reporter=verbose
