name: Pre-contact movement regression CI

on:
  push:
    branches:
      - debug/current-20260907-precontact-movement-ci
    paths:
      - "src/**"
      - ".github/workflows/swf-spec.yml"

jobs:
  movement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Movement regression before raw contact change
        run: npx vitest run src/game/systems/movementRegression.test.ts --reporter=verbose
