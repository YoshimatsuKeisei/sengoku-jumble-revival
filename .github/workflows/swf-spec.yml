name: General command focused CI

on:
  workflow_dispatch:
  push:
    branches:
      - debug/current-20260907-ranged-command-trap-runtime-ci
    paths:
      - "src/**"
      - "tests/swf-spec/**"
      - "swf-spec/**"
      - ".github/workflows/swf-spec.yml"

concurrency:
  group: general-command-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vite production bundle
        run: npx vite build
      - name: General command raw callback conformance
        run: >-
          npx vitest run
          tests/swf-spec/rangedCommandDirectConformance.test.ts
          tests/swf-spec/forcedRangedNoTarget.test.ts
          tests/swf-spec/rangedTargetAcquisitionDirectConformance.test.ts
          tests/swf-spec/rangedTargetImpulseConformance.test.ts
          --reporter=verbose
      - name: General recipient regression
        run: >-
          npx vitest run
          src/game/systems/generalAttackSystem.test.ts
          --reporter=verbose
