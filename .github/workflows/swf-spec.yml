name: Sequential SWF contact prototype

on:
  workflow_dispatch:
  push:
    branches:
      - debug/current-20260907-contact-grid-prototype-ci

concurrency:
  group: sequential-contact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vite production bundle
        run: npx vite build
      - name: Sequential contact prototype
        run: npx vitest run tests/swf-spec/soldierContactSequentialRuntime.test.ts --reporter=verbose
      - name: Full SWF conformance suite
        run: npx vitest run tests/swf-spec --reporter=verbose
      - name: Stable movement regressions excluding pre-existing stale obstacleAvoidance imports
        run: >-
          npx vitest run
          src/game/systems/baseContactSystem.test.ts
          src/game/systems/baseGateRecoveryGeometry.test.ts
          src/game/systems/recoverySystem.test.ts
          src/game/systems/swfIntegrationPreservation.test.ts
          src/game/systems/phase3eBattlefield.test.ts
          src/game/systems/phase3fFidelity.test.ts
          src/game/systems/phase3gFixes.test.ts
          src/game/systems/phase3hIntegration.test.ts
          src/game/systems/phase3jPlayerControl.test.ts
          src/game/systems/strategyEngagement.test.ts
          src/game/systems/phase4c1TargetStrategy.test.ts
          --reporter=verbose
