name: Grouped SWF conformance CI

on:
  workflow_dispatch:
  push:
    branches:
      - debug/current-20260907-ranged-command-trap-runtime-full-ci
    paths:
      - "src/**"
      - "tests/swf-spec/**"
      - "swf-spec/**"
      - ".github/workflows/swf-spec.yml"

concurrency:
  group: grouped-swf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  grouped:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vite production bundle
        run: npx vite build
      - name: Full SWF conformance suite
        id: swf
        continue-on-error: true
        run: npx vitest run tests/swf-spec --reporter=verbose
      - name: Special ability regression
        id: abilities
        continue-on-error: true
        run: npx vitest run src/game/systems/swfSpecialAbilities.test.ts --reporter=verbose
      - name: Strategy regression
        id: strategy
        continue-on-error: true
        run: >-
          npx vitest run
          src/game/systems/strategyEngagement.test.ts
          src/game/systems/phase4c1TargetStrategy.test.ts
          --reporter=verbose
      - name: Machine-readable SWF result
        if: always()
        run: npx vitest run tests/swf-spec --reporter=json --outputFile=swf-spec-results.json || true
      - name: Upload SWF result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grouped-swf-spec-results
          path: swf-spec-results.json
          if-no-files-found: warn
      - name: Fail if grouped checks failed
        if: always()
        run: >-
          test "${{ steps.swf.outcome }}" = success
          -a "${{ steps.abilities.outcome }}" = success
          -a "${{ steps.strategy.outcome }}" = success
