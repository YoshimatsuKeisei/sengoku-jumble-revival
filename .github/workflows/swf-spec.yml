name: Final raw-contact residual CI

on:
  push:
    branches:
      - debug/current-20260907-raw-contact-final-ci
    paths:
      - "src/**"
      - "tests/swf-spec/**"
      - "swf-spec/**"
      - ".github/workflows/swf-spec.yml"

concurrency:
  group: final-raw-contact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vite production bundle
        run: npx vite build
      - name: Full SWF conformance
        run: npx vitest run tests/swf-spec --reporter=verbose
      - name: Movement regression
        run: npx vitest run src/game/systems/movementRegression.test.ts --reporter=verbose
      - name: Strategy target regression
        run: >-
          npx vitest run
          src/game/systems/strategyEngagement.test.ts
          src/game/systems/phase4c1TargetStrategy.test.ts
          --reporter=verbose
