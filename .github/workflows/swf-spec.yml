name: Ranged impulse focused CI

on:
  push:
    branches:
      - debug/current-20260907-ranged-impulse-ci
    paths:
      - "src/**"
      - "tests/swf-spec/**"
      - ".github/workflows/swf-spec.yml"

concurrency:
  group: ranged-impulse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vite production bundle
        run: npx vite build
      - name: Ranged impulse and ranged-path conformance
        continue-on-error: true
        run: >-
          npx vitest run
          tests/swf-spec/rangedTargetImpulseConformance.test.ts
          tests/swf-spec/rangedCommandDirectConformance.test.ts
          tests/swf-spec/rangedGaugeDirectConformance.test.ts
          tests/swf-spec/forcedRangedNoTarget.test.ts
          --reporter=verbose
      - name: Reaction integration regression
        if: always()
        run: npx vitest run src/game/systems/reactionSystem.test.ts --reporter=verbose
