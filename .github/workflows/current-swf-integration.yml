name: Current SWF integration

on:
  workflow_dispatch:
  push:
    branches:
      - debug/current-swf-conformance
    paths:
      - "src/**"
      - ".github/workflows/current-swf-integration.yml"

concurrency:
  group: current-swf-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Movement and base-line regression
        run: npx vitest run src/game/systems/movementRegression.test.ts src/game/systems/baseContactSystem.test.ts --reporter=verbose
      - name: Attack regression
        run: npx vitest run src/game/systems/attackSystem.test.ts --reporter=verbose
      - name: Reaction regression
        run: npx vitest run src/game/systems/reactionSystem.test.ts --reporter=verbose
      - name: Recovery regression
        run: npx vitest run src/game/systems/recoverySystem.test.ts --reporter=verbose
      - name: SWF combat regression
        run: npx vitest run src/game/systems/swfCombatRules.test.ts --reporter=verbose
      - name: Diagnose systems A-H
        continue-on-error: true
        shell: bash
        run: |
          files=$(find src/game/systems -maxdepth 1 -name '*.test.ts' -printf '%f\n' | sort | awk 'tolower(substr($0,1,1)) >= "a" && tolower(substr($0,1,1)) <= "h" {print "src/game/systems/" $0}')
          test -z "$files" || npx vitest run $files --reporter=verbose
      - name: Diagnose systems I-P
        continue-on-error: true
        shell: bash
        run: |
          files=$(find src/game/systems -maxdepth 1 -name '*.test.ts' -printf '%f\n' | sort | awk 'tolower(substr($0,1,1)) >= "i" && tolower(substr($0,1,1)) <= "p" {print "src/game/systems/" $0}')
          test -z "$files" || npx vitest run $files --reporter=verbose
      - name: Diagnose systems Q-Z
        continue-on-error: true
        shell: bash
        run: |
          files=$(find src/game/systems -maxdepth 1 -name '*.test.ts' -printf '%f\n' | sort | awk 'tolower(substr($0,1,1)) >= "q" && tolower(substr($0,1,1)) <= "z" {print "src/game/systems/" $0}')
          test -z "$files" || npx vitest run $files --reporter=verbose
      - name: Diagnose non-system game tests
        continue-on-error: true
        shell: bash
        run: |
          files=$(find src/game -name '*.test.ts' ! -path 'src/game/systems/*' | sort)
          test -z "$files" || npx vitest run $files --reporter=verbose
      - name: Full test suite
        run: npm test
